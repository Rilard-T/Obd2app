name: Build and Publish OBD2 Auto APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Prepare keystores and optional Firebase config
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi
          if [ ! -f app/google-services.json ] && [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests (Play & GitHub channels)
        run: |
          gradle :app:testDebugUnitTest -PdistributionChannel=play -Pkotlin.compiler.execution.strategy=daemon --no-daemon
          gradle :app:testDebugUnitTest -PdistributionChannel=github -PgithubRepoUrl="https://github.com/${{ github.repository }}/releases" -Pkotlin.compiler.execution.strategy=daemon --no-daemon

      - name: Build GitHub Direct Edition Debug APK
        run: |
          gradle :app:assembleDebug \
            -PdistributionChannel=github \
            -PgithubRepoUrl="https://github.com/${{ github.repository }}/releases" \
            -Pkotlin.compiler.execution.strategy=daemon \
            --no-daemon

      - name: Build GitHub Direct Edition Signed Release APK (when keystore configured)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -PdistributionChannel=github \
            -PgithubRepoUrl="https://github.com/${{ github.repository }}/releases" \
            -Pkotlin.compiler.execution.strategy=daemon \
            --no-daemon

      - name: Prepare GitHub direct .apk release assets
        run: |
          mkdir -p release-apks
          TAG_SUFFIX="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${TAG_SUFFIX}"
          else
            VER="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "RELEASE_TAG=v${VER}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "release-apks/OBD2-Auto-v${VER}-github-debug.apk"
          if [ "${{ env.HAS_RELEASE_KEY }}" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-apks/OBD2-Auto-v${VER}-github-release.apk"
          fi

      - name: Build Google Play Edition Signed AAB (when keystore configured)
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:bundleRelease \
            -PdistributionChannel=play \
            -Pkotlin.compiler.execution.strategy=daemon \
            --no-daemon

      - name: Upload Google Play AAB artifact
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: google-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

      - name: Publish direct .apk files to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "OBD2 Auto ${{ env.RELEASE_TAG }} (GitHub Edition)"
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          files: |
            release-apks/*.apk
